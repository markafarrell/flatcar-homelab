---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # flux
  - ../../base/apps/flux-operator.yml
  - ../../base/apps/flux-instance.yml

  # kube-vip
  - https://kube-vip.io/manifests/rbac.yaml
  - ../../base/apps/kube-vip.yml

  # kured
  - ../../base/apps/kured.yml

  # ingress-nginx
  - ../../base/apps/ingress-nginx.yml

  # cert-manager
  - ../../base/apps/cert-manager.yml
  - ../../base/apps/cert-manager-cluster-issurer.yml

  # dex
  - ../../base/apps/dex.yml
  - ../../base/apps/dex-secret.yml

  # rook-ceph
  - ../../base/apps/rook-ceph-operator.yml
  - ../../base/apps/rook-ceph-cluster.yml
  - ../../base/apps/rook-ceph.yml

  # route53-dynamic-dns
  - ../../base/apps/route53-dynamic-dns.yml
  - ../../base/apps/route53-dynamic-dns-secret.yml
