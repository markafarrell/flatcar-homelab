apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: kured
  namespace: flux-system
  annotations:
    fluxcd.controlplane.io/reconcile: "enabled"
    fluxcd.controlplane.io/reconcileEvery: "30m"
    fluxcd.controlplane.io/reconcileTimeout: "5m"
spec:
  resources:
    - apiVersion: v1
      kind: Namespace
      metadata:
        name: kured

    - apiVersion: source.toolkit.fluxcd.io/v1
      kind: OCIRepository
      metadata:
        name: kured
        namespace: kured
      spec:
        interval: 10m
        url: oci://ghcr.io/kubereboot/charts/kured
        ref:
          semver: ">=5.10.0"

    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: kured
        namespace: kured
      spec:
        interval: 1h
        releaseName: kured
        chartRef:
          kind: OCIRepository
          name: kured
