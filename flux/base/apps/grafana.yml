apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: grafana
  namespace: flux-system
  annotations:
    fluxcd.controlplane.io/reconcile: "enabled"
    fluxcd.controlplane.io/reconcileEvery: "30m"
    fluxcd.controlplane.io/reconcileTimeout: "5m"
spec:
  resources:
    - apiVersion: grafana.integreatly.org/v1beta1
      kind: Grafana
      metadata:
        name: grafana
        namespace: grafana
        labels:
          dashboards: "grafana"
      spec:
        config:
          log:
            mode: "console"
          plugins:
            preinstall: victoriametrics-metrics-datasource
          server:
            root_url: https://grafana.homelab.evilcyborgdrone.com/
          auth.github:
            enabled: "true"
            allowed_organizations: farrell-white
            allow_assign_grafana_admin: "true"
            role_attribute_path: |
              contains(groups[*], '@farrell-white/k8s-admin') && 'GrafanaAdmin' || 'Viewer'
        deployment:
          spec:
            template:
              spec:
                containers:
                  - name: grafana
                    env:
                      - name: GF_AUTH_GITHUB_CLIENT_ID
                        valueFrom:
                          secretKeyRef:
                            name: github-oauth-credentials
                            key: client-id
                      - name: GF_AUTH_GITHUB_CLIENT_SECRET
                        valueFrom:
                          secretKeyRef:
                            name: github-oauth-credentials
                            key: client-secret
        ingress:
          metadata:
            annotations:
              kubernetes.io/ingress.class: "nginx"
              cert-manager.io/cluster-issuer: "letsencrypt-prod"
          spec:
            rules:
              - host: grafana.homelab.evilcyborgdrone.com
                http:
                  paths:
                    - backend:
                        service:
                          name: grafana-service
                          port:
                            number: 3000
                      path: /
                      pathType: Prefix
            tls:
              - hosts:
                  - grafana.homelab.evilcyborgdrone.com
                secretName: grafana-tls

    - apiVersion: grafana.integreatly.org/v1beta1
      kind: GrafanaDatasource
      metadata:
        name: victoria-metrics
        namespace: grafana
      spec:
        instanceSelector:
          matchLabels:
            dashboards: "grafana"
        allowCrossNamespaceImport: true
        datasource:
          name: VictoriaMetrics
          type: victoriametrics-metrics-datasource
          access: proxy
          url: http://vmsingle-vm.vm.svc.cluster.local:8428
          isDefault: true
